name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest

    steps:
      - name: Check Unity license secret
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)) {
            throw "UNITY_LICENSE secret is empty or missing."
          }

          $license = $env:UNITY_LICENSE.Trim()

          Write-Host "UNITY_LICENSE is present."
          Write-Host "License length: $($license.Length) characters."
          Write-Host "Starts with XML: $($license.StartsWith('<?xml'))"
          Write-Host "Ends with root: $($license.EndsWith('</root>'))"
          Write-Host "Contains UnityPersonal: $($license.Contains('UnityPersonal'))"



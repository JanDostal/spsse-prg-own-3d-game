name: Test Unity License

on:
  workflow_dispatch:

jobs:
  test-license:
    runs-on: ubuntu-latest

    steps:
      - name: Check Unity license secret
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UNITY_LICENSE)) {
            throw "UNITY_LICENSE secret is empty or missing."
          }

          $license = $env:UNITY_LICENSE.Trim()

          try {
            [xml]$license | Out-Null
          }
          catch {
            throw "UNITY_LICENSE is not valid XML."
          }

          Write-Host "UNITY_LICENSE is present."
          Write-Host "License length: $($license.Length) characters."
          Write-Host "UNITY_LICENSE is valid XML."

      - name: Test Unity activation
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Star-Wars-Combat-Arena
          targetPlatform: StandaloneWindows64
          buildMethod: ''

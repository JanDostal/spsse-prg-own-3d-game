name: Check Version Label

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  check-label:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version label
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels: $LABELS_JSON"

          has_breaking=false
          has_enhancement=false
          has_bug=false

          while IFS= read -r label; do
            case "$label" in
              breaking-change)
                has_breaking=true
                ;;
              enhancement)
                has_enhancement=true
                ;;
              bug)
                has_bug=true
                ;;
            esac
          done < <(echo "$LABELS_JSON" | jq -r '.[]')

          count=0

          [ "$has_breaking" = true ] && count=$((count + 1))
          [ "$has_enhancement" = true ] && count=$((count + 1))
          [ "$has_bug" = true ] && count=$((count + 1))

          if [ "$count" -eq 0 ]; then
            echo "ERROR: PR must have exactly one version label."
            echo "Required: breaking-change, enhancement, or bug."
            exit 1
          fi

          if [ "$count" -gt 1 ]; then
            echo "ERROR: PR has multiple version labels."
            echo "Use exactly one of: breaking-change, enhancement, bug."
            exit 1
          fi

          echo "Version label is valid."

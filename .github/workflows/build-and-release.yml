name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:

  build-and-release:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
           ref: v1.0.0

      - name: Get Unity version
        id: unity-version
        shell: bash
        run: |
          UNITY_VERSION=$(grep 'm_EditorVersion:' Star-Wars-Combat-Arena/ProjectSettings/ProjectVersion.txt | cut -d ' ' -f2)
          echo "Unity version: $UNITY_VERSION"
          echo "version=$UNITY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
           path: Star-Wars-Combat-Arena/Library
           key: UnityLibrary-${{ runner.os }}-${{ steps.unity-version.outputs.version }}-${{ hashFiles('Star-Wars-Combat-Arena/Packages/packages-lock.json', 'Star-Wars-Combat-Arena/ProjectSettings/ProjectVersion.txt') }}
           restore-keys: |
             UnityLibrary-${{ runner.os }}-${{ steps.unity-version.outputs.version }}-

      - name: Get Product Name
        id: product-name
        shell: bash
        run: |
          PRODUCT_NAME=$(grep 'productName:' Star-Wars-Combat-Arena/ProjectSettings/ProjectSettings.asset | cut -d ':' -f2- | sed 's/^ *//')
          echo "Product name: $PRODUCT_NAME"
          echo "name=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Star-Wars-Combat-Arena
          targetPlatform: StandaloneWindows64
          buildsPath: build
          buildName: ${{ steps.product-name.outputs.name }}

      - name: Install Wine
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 xvfb
          
      - name: Install Inno Setup
        shell: bash
        run: |
          wget -O innosetup.exe \
            https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe

          xvfb-run -a wine innosetup.exe \
            /VERYSILENT \
            /SUPPRESSMSGBOXES \
            /NORESTART \
            /SP-
            
          rm innosetup.exe

      - name: Test Inno Setup Compiler
        shell: bash
        run: |
          xvfb-run -a wine "C:/Program Files/Inno Setup 7/ISCC.exe" /?



name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:

  build-and-release:
    runs-on: ubuntu-24.04
    
    env:
      INSTALLER_PATH: installer
      BUILD_PATH: build
      BUILD_TARGET_PLATFORM: StandaloneWindows64
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
           ref: v1.0.0

      - name: Get Unity version
        id: unity-version
        shell: bash
        run: |
          UNITY_VERSION=$(grep 'm_EditorVersion:' Star-Wars-Combat-Arena/ProjectSettings/ProjectVersion.txt | cut -d ':' -f2- | sed 's/^ *//')
          echo "Unity version: $UNITY_VERSION"
          echo "version=$UNITY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
           path: Star-Wars-Combat-Arena/Library
           key: UnityLibrary-${{ runner.os }}-${{ steps.unity-version.outputs.version }}-${{ hashFiles('Star-Wars-Combat-Arena/Packages/packages-lock.json', 'Star-Wars-Combat-Arena/ProjectSettings/ProjectVersion.txt') }}
           restore-keys: |
             UnityLibrary-${{ runner.os }}-${{ steps.unity-version.outputs.version }}-

      - name: Get Product Name
        id: product-name
        shell: bash
        run: |
          PRODUCT_NAME=$(grep 'productName:' Star-Wars-Combat-Arena/ProjectSettings/ProjectSettings.asset | cut -d ':' -f2- | sed 's/^ *//')
          echo "Product name: $PRODUCT_NAME"
          echo "name=$PRODUCT_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Star-Wars-Combat-Arena
          targetPlatform: ${{ env.BUILD_TARGET_PLATFORM }}
          buildsPath: ${{ env.BUILD_PATH }}
          buildName: ${{ steps.product-name.outputs.name }}

      - name: Prepare installer icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p "$INSTALLER_PATH"

          convert \
            Star-Wars-Combat-Arena/Assets/game_icon.jpg \
            -define icon:auto-resize=256,128,64,48,32,16 \
            "$INSTALLER_PATH/game_icon.ico"

          ls -lh "$INSTALLER_PATH/game_icon.ico"

      - name: Install Wine
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 xvfb
          
      - name: Install Inno Setup
        shell: bash
        run: |
          wget -O innosetup.exe \
            https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe

          xvfb-run -a wine innosetup.exe \
            /VERYSILENT \
            /SUPPRESSMSGBOXES \
            /NORESTART \
            /SP-
            
          rm innosetup.exe

      - name: Build installer
        shell: bash
        run: |
          VERSION=$(grep 'bundleVersion:' Star-Wars-Combat-Arena/ProjectSettings/ProjectSettings.asset | cut -d ':' -f2- | sed 's/^ *//')
          PRODUCT_NAME=$(grep 'productName:' Star-Wars-Combat-Arena/ProjectSettings/ProjectSettings.asset | cut -d ':' -f2- | sed 's/^ *//')
          COMPANY_NAME=$(grep 'companyName:' Star-Wars-Combat-Arena/ProjectSettings/ProjectSettings.asset | cut -d ':' -f2- | sed 's/^ *//')
          APP_URL=${{ github.server_url }}/${{ github.repository }}

          echo "Product name: $PRODUCT_NAME"
          echo "Version: $VERSION"
          echo "Company name: $COMPANY_NAME"
          echo "App url: $APP_URL"
          echo "Installer path: $INSTALLER_PATH"

          cat > installer.iss <<EOF
          #define MyAppName "Star Wars Combat Arena"
          #define MyAppVersion "$VERSION"
          #define MyAppPublisher "$COMPANY_NAME"
          #define MyAppURL "$APP_URL"
          #define MyAppExeName "$PRODUCT_NAME.exe"

          [Setup]
          ; NOTE: The value of AppId uniquely identifies this application. Do not use the same AppId value in installers for other applications.
          ; (To generate a new GUID, click Tools | Generate GUID inside the IDE.)
          AppId={{A27CBDF1-5949-49E8-9D33-169490E6A448}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          ;AppVerName={#MyAppName} {#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={autopf32}\{#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}

          ; "ArchitecturesAllowed=x64compatible" specifies that Setup cannot run
          ; on anything but x64 and Windows 11 on Arm.
          ArchitecturesAllowed=x64compatible

          ; "ArchitecturesInstallIn64BitMode=x64compatible" requests that the
          ; install be done in "64-bit mode" on x64 or Windows 11 on Arm,
          ; meaning it should use the native 64-bit Program Files directory and
          ; the 64-bit view of the registry.
          ArchitecturesInstallIn64BitMode=x64compatible

          DisableProgramGroupPage=yes

          ; Uncomment the following line to run in non administrative install mode (install for current user only).
          ;PrivilegesRequired=lowest

          OutputDir=$INSTALLER_PATH
          OutputBaseFilename=$PRODUCT_NAME-installer
          SetupIconFile=$INSTALLER_PATH\game_icon.ico
          SolidCompression=yes
          WizardStyle=modern dynamic

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "$BUILD_PATH\\$BUILD_TARGET_PLATFORM\\{#MyAppExeName}"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$BUILD_PATH\\$BUILD_TARGET_PLATFORM\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          ; NOTE: Don't use "Flags: ignoreversion" on any shared system files

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
          EOF

          echo "Generated installer.iss:"
          cat installer.iss

          xvfb-run -a wine "C:/Program Files/Inno Setup 7/ISCC.exe" installer.iss

          echo "Created installer:"
          ls -lh "$INSTALLER_PATH/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
           files: ${{ env.INSTALLER_PATH }}/*.exe
           make_latest: true

